<template id="guide-economic-indicators">
<ul>
<li><strong>GDP.</strong> Gross domestic product: the value of
everything produced in a country in a year. <em>Nominal</em> GDP is in
today’s prices; <em>real</em> GDP (chain volume, chained dollars)
removes price changes, so it measures growth in output.</li>
<li><strong>Purchasing power parity (PPP).</strong> A conversion that
adjusts for differences in prices between countries, so GDP per person
and productivity compare what the money buys, not just the exchange
rate.</li>
<li><strong>Productivity.</strong> Output per hour worked. The growth
chart is an index; the level chart compares the two countries in the
same units.</li>
<li><strong>Value added.</strong> What each industry adds to the
economy: its output less the inputs it buys. Industries’ value added
sums to GDP before taxes on products.</li>
<li><strong>ISIC.</strong> The UN’s International Standard Industrial
Classification. The ABS and BEA each map their own industries (ANZSIC
and NAICS) to it for the OECD, so the industry shares compare like with
like.</li>
<li><strong>Owner-occupied housing.</strong> National accounts count a
rent that owner-occupiers notionally pay themselves. It is left out of
the industry shares because it is not produced by a business.</li>
<li><strong>Financial and calendar years.</strong> Australian national
accounts run July to June; US data are calendar years.</li>
</ul>
</template>
<template id="guide-intellectual-property">
<ul>
<li><strong>Patent application.</strong> A request to IP Australia for a
standard (complete) patent. Counted by the earliest filing date anywhere
in the world.</li>
<li><strong>US applicant.</strong> At least one applicant or owner on
the application has a US address. This is ownership, not where the
inventors live.</li>
<li><strong>Joint filing.</strong> An application with both a US and an
Australian applicant.</li>
<li><strong>Publication lag.</strong> Filings made through the
international (PCT) route can reach Australia 30 months or more after
they were first filed, so the latest years are incomplete. They are
shaded on the time-series charts.</li>
<li><strong>Trade mark classes.</strong> The 45 Nice classes (1-34
goods, 35-45 services) that a trade mark is registered for.</li>
<li><strong>Madrid system.</strong> The international route for trade
marks: one application through WIPO that designates Australia.</li>
<li><strong>Sector and field.</strong> WIPO’s grouping of patent
classification codes into 35 technology fields and five sectors.</li>
</ul>
</template>
<template id="guide-trade-overview">
<ul>
<li><strong>Exports and imports.</strong> In the ABS balance of
payments, exports of services are called <em>credits</em> and imports
<em>debits</em>. This dashboard uses exports and imports throughout;
chart file names still use the ABS terms.</li>
<li><strong>Goods and services.</strong> Goods are physical products
(beef, gold, aircraft). Services include travel, education, transport,
finance and intellectual property charges.</li>
<li><strong>SITC.</strong> The Standard International Trade
Classification, the UN’s product codes for goods. Three-digit codes
(e.g. 971 non-monetary gold) are used on the Trade in goods page.</li>
<li><strong>n.i.e. and n.e.s.</strong> “Not included elsewhere” and “not
elsewhere specified”: catch-all categories for items that do not fit a
named code.</li>
<li><strong>Non-monetary gold.</strong> Gold traded as a commodity
(bullion), as opposed to gold held by central banks. Its value swings
with gold prices and bullion flows, so the US balance is also shown
without it.</li>
<li><strong>Trade balance.</strong> Exports less imports. A US surplus
with Australia means Australia buys more from the US than it sells
there.</li>
<li><strong>Calendar years.</strong> All trade figures here are calendar
years (January to December).</li>
</ul>
</template>
<template id="guide-energy">
<ul>
<li><strong>Generation mix.</strong> The share of electricity produced
from each fuel. Rooftop (small-scale) solar is counted for both
countries, including the US states (EIA's estimate of small-scale
solar by state), even though it is not sold through the grid.</li>
<li><strong>Renewables.</strong> Hydro, wind, solar, bioenergy and
geothermal. Nuclear is low-carbon but not renewable; the dashed US line
adds nuclear to show all low-carbon generation.</li>
<li><strong>Data centre share of electricity.</strong> AEMO's forecast is
a share of NEM operational consumption; the US figures (LBNL, EPRI) are
shares of total US electricity use. Close enough to compare, not identical.</li>
<li><strong>LCOE.</strong> Levelised cost of electricity: the lifetime
cost of building and running a new plant, divided by the electricity it
produces (per MWh). It compares technologies and countries on the same
basis.</li>
<li><strong>Wholesale price.</strong> The price generators are paid in
the spot market, before network charges and retail margins. Real-time
prices are set close to delivery; day-ahead prices a day before.</li>
<li><strong>NEM.</strong> The National Electricity Market, covering
Queensland, New South Wales, the ACT, Victoria, South Australia and
Tasmania. Western Australia and the Northern Territory have separate
grids.</li>
<li><strong>Financial and calendar years.</strong> Australian energy
statistics run July to June (financial years); the charts say which is
used.</li>
<li><strong>MWh, GWh, TWh.</strong> Megawatt hours, gigawatt hours and
terawatt hours (1 TWh = 1,000 GWh = 1 million MWh).</li>
</ul>
</template>
<template id="guide-data-centres">
<ul>
<li><strong>Information Media &amp; Telecommunications (IMT).</strong>
The ABS industry (ANZSIC division J) that includes data centres, along
with telecommunications, broadcasting and publishing. The ABS does not
publish data centre spending on its own, so IMT is the closest official
measure.</li>
<li><strong>EPM.</strong> Equipment, plant and machinery: servers,
network gear, cooling and power equipment. <strong>B&amp;S</strong> is
buildings and structures.</li>
<li><strong>Capex.</strong> Private new capital expenditure (ABS
5625.0), current prices, not adjusted for inflation unless the chart
says “real”.</li>
<li><strong>Estimates 1 to 7.</strong> The ABS asks firms about each
financial year seven times: three times before it starts (estimates
1-3), three times during it (4-6) and once it ends (7, the actual
outturn). Comparing the same estimate number across years is like for
like.</li>
<li><strong>Realisation ratio.</strong> Actual spending divided by the
first estimate (estimate 1). Above 1x means firms spent more than they
first planned.</li>
<li><strong>Commercial buildings n.e.c.</strong> “Not elsewhere
classified”: the ABS building category that includes data centres, along
with other commercial buildings it does not list separately.</li>
<li><strong>SITC 752 and 759.</strong> Standard International Trade
Classification codes for computers and for computer parts.</li>
<li><strong>MW, GW, TWh.</strong> Megawatts and gigawatts measure power
drawn at a point in time (1 GW = 1,000 MW); terawatt hours measure
energy used over a year.</li>
<li><strong>NEM.</strong> The National Electricity Market, the grid
covering Queensland, New South Wales, the ACT, Victoria, South Australia
and Tasmania.</li>
<li><strong>Gaps in lines.</strong> Quarters the ABS does not publish
(marked “np”) are left as gaps, not drawn across.</li>
</ul>
</template>
<div class="modal fade" id="page-guide-modal" tabindex="-1" aria-labelledby="page-guide-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="page-guide-title">How to read this page</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body page-guide-body"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var modalEl = document.getElementById("page-guide-modal");
  var body = modalEl.querySelector(".page-guide-body");
  document.querySelectorAll('template[id^="guide-"]').forEach(function (t) {
    var page = document.getElementById(t.id.replace(/^guide-/, ""));
    var header = page && page.querySelector(".card-header");
    if (!header) return;
    var a = document.createElement("button");
    a.type = "button";
    a.className = "page-guide-link";
    a.innerHTML = '<span aria-hidden="true">&#9432;</span> How to read this page';
    a.addEventListener("click", function () {
      body.innerHTML = "";
      body.appendChild(t.content.cloneNode(true));
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    });
    // Top right of the panel header; if the tabs run underneath it (full-width
    // panels), move it under the panel title instead.
    header.appendChild(a);
    var place = function () {
      var r = a.getBoundingClientRect();
      if (!r.width) return;
      var hit = Array.prototype.some.call(header.querySelectorAll(".nav-link"), function (t) {
        var q = t.getBoundingClientRect();
        return !(r.right < q.left || r.left > q.right || r.bottom < q.top || r.top > q.bottom);
      });
      var title = header.querySelector(".card-title");
      if (hit && title && !a.classList.contains("inline")) { a.classList.add("inline"); title.appendChild(a); }
    };
    document.addEventListener("shown.bs.tab", place);
    window.addEventListener("resize", place);
    setTimeout(place, 0);
  });
})();
</script>
